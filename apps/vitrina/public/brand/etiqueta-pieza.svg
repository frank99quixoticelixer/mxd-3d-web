<?xml version="1.0" encoding="UTF-8"?>
<!-- Etiqueta de pieza MXD, monocromatica (negro sobre blanco). Tamano fisico 90 x 62 mm (viewBox 900 x 620 = 10 unidades por mm).
     Campos editables: elementos con id "campo-*". -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="90mm" height="62mm" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <clipPath id="recorte"><rect x="4" y="4" width="892" height="612" rx="28"/></clipPath>
  </defs>
  <rect x="4" y="4" width="892" height="612" rx="28" fill="#ffffff"/>
  <g clip-path="url(#recorte)">
    <rect x="0" y="0" width="900" height="64" fill="#000000"/>
    <rect x="0" y="64" width="270" height="556" fill="#ffffff"/>
    <line x1="270" y1="64" x2="270" y2="620" stroke="#000000" stroke-width="3"/>
  </g>
  <text x="300" y="42" font-size="26" font-weight="700" letter-spacing="5" fill="#ffffff">ETIQUETA DE PIEZA</text>
  <text x="870" y="42" font-size="26" font-weight="700" letter-spacing="5" fill="#ffffff" text-anchor="end">MXD</text>

  <image x="35" y="88" width="200" height="104" xlink:href="data:image/png;base64,"/>

  <g fill="#000000" font-size="17" font-weight="700" letter-spacing="2">
    <text x="35" y="240">MODELO</text>
    <text x="35" y="350">CANTIDAD</text>
    <text x="300" y="112">NOMBRE DE LA PIEZA</text>
    <text x="300" y="226">SKU</text>
    <text x="300" y="352">MODULO</text>
    <text x="490" y="352">UBICACION</text>
    <text x="300" y="470">No. DE PARTE MXD (BOM)</text>
  </g>
  <g fill="#000000">
    <text id="campo-modelo" x="35" y="290" font-size="44" font-weight="700"></text>
    <text id="campo-cantidad" x="35" y="400" font-size="44" font-weight="700"></text>
    <text id="campo-nombre" x="300" y="168" font-size="46" font-weight="700"></text>
    <text id="campo-sku" x="300" y="294" font-size="68" font-weight="700" font-family="Consolas, 'Courier New', monospace"></text>
    <text id="campo-modulo" x="300" y="402" font-size="32" fill="#000000"></text>
    <text id="campo-ubicacion" x="490" y="402" font-size="32" fill="#000000"></text>
    <text id="campo-numeroBom" x="300" y="530" font-size="34" font-weight="700" font-family="Consolas, 'Courier New', monospace">MXD-MX80-PRO-PZA-005-R00</text>
  </g>
  <g stroke="#000000" stroke-width="3">
    <line x1="35" y1="304" x2="235" y2="304"/>
    <line x1="35" y1="414" x2="235" y2="414"/>
    <line x1="300" y1="182" x2="870" y2="182"/>
    <line x1="300" y1="308" x2="870" y2="308"/>
    <line x1="300" y1="414" x2="460" y2="414"/>
    <line x1="490" y1="414" x2="870" y2="414"/>
    <line x1="300" y1="544" x2="870" y2="544"/>
  </g>
  <rect x="4" y="4" width="892" height="612" rx="28" fill="none" stroke="#000000" stroke-width="5"/>
</svg>
